name: Auditoria do histórico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Auditar histórico
        run: php tools/auditar-historico-seguranca.php
