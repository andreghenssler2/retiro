name: Qualidade

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Informações do ambiente
        run: |
          php -v
          composer --version

      - name: Validar sintaxe PHP
        run: php tools/ci-php-lint.php

      - name: Testes críticos
        run: php tests/critical/run.php

      - name: Data/hora do webhook Asaas
        run: php tests/critical/asaas-data-hora.php

      - name: Segurança HTTP e sessão
        run: php tests/critical/seguranca-http.php

      - name: Modo de manutenção
        run: php tests/critical/manutencao.php

      - name: Dados persistentes no deploy
        run: php tests/critical/dados-persistentes.php

      - name: Segurança de autenticação
        run: php tests/critical/autenticacao-seguranca.php

      - name: Auditar dados persistentes rastreados
        run: php tools/deploy/auditar-dados-persistentes.php

      - name: Deploy e recuperação
        run: php tests/critical/deploy-recuperacao.php

      - name: Prontidão para produção
        run: php tests/critical/prontidao-producao.php

      - name: Deploy de produção controlado
        run: php tests/critical/deploy-producao-controlado.php

      - name: Validar Composer
        working-directory: lib
        run: composer validate --strict --no-check-publish

      - name: Auditoria de dependências
        working-directory: lib
        run: composer audit --locked --no-interaction

      - name: Verificar arquivos sensíveis
        run: |
          if [ -f tools/verificar-seguranca-repositorio.php ]; then
            php tools/verificar-seguranca-repositorio.php
          else
            echo "Verificador de segurança ainda não instalado."
            exit 1
          fi
